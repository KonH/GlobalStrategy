name: Deploy Unity Play

on:
  push:
    branches: [main]
    paths:
      - Assets/**
      - Packages/**
      - ProjectSettings/**
      - scripts/ci/deploy_unity_play.py
      - .github/workflows/deploy-unity-play.yml
  workflow_dispatch:

concurrency:
  group: deploy-unity-play
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build WebGL and deploy to Unity Play
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: false
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          unityVersion: auto
          buildProfile: Assets/Settings/Build Profiles/Web - Desktop - Release.asset
          buildName: WebGL
          buildsPath: build

      - name: Upload WebGL artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalStrategy-WebGL
          path: build/WebGL
          if-no-files-found: error
          retention-days: 14

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deploy to Unity Play
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_PLAY_PROJECT_ID: ${{ secrets.UNITY_PLAY_PROJECT_ID }}
          UNITY_PLAY_TITLE: ${{ vars.UNITY_PLAY_TITLE }}
        run: |
          PROJECT_ID="${UNITY_PLAY_PROJECT_ID:-790490b4-2b09-4c1c-8a2e-df23f6b43b47}"
          TITLE="${UNITY_PLAY_TITLE:-Global Strategy}"
          python scripts/ci/deploy_unity_play.py \
            --build-dir build/WebGL \
            --project-id "$PROJECT_ID" \
            --title "$TITLE"
