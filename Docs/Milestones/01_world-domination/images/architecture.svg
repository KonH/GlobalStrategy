<svg width="1200" height="850" viewBox="0 0 1200 850" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GlobalStrategy layered architecture: ECS.Core underlies a Foundation layer of shared data and config projects, which underlies Game.Systems, which underlies Game.Main, the orchestrator. Four independent entry points, Game.Bots, Game.ConsoleRunner, Game.WebClient, and Game.Benchmarks/Evals, plus the Unity Player/Editor, all depend on Game.Main. Unity specifically consumes it as a compiled DLL under Assets/Plugins/Core/.">
