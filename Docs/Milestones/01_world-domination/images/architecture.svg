  <rect x="182" y="700" width="840" height="126" rx="8" fill="#e8f0ff" stroke="#4c8dff" stroke-width="2"/>
  <text x="602" y="734" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2233" font-family="Arial, sans-serif">Unity Player / Editor</text>
