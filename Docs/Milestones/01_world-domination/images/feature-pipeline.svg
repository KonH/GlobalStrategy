<svg width="1620" height="350" viewBox="0 0 1620 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Feature pipeline: a GitHub issue flows through Spec, an optional Remote Session for spec review, Plan, and Implement, all running inside a Linux VPS running agents, tagged ai-specify, ai-plan, and ai-implement along the way, producing spec.md and plan.md as artifacts. It then moves to a Dev Machine running Unity and agents for PR review and a manual Unity smoke test, then to main, then to Unity Play.">
  <rect width="1620" height="350" fill="#1c2028"/>
  <defs>
    <marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c3c9d3"/>
    </marker>
    <marker id="arrowPd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b93a3"/>
    </marker>
  </defs>

  <rect x="140" y="130" width="820" height="170" rx="10" fill="#1e2a3f" stroke="#3b5a86" stroke-width="1.5"/>
  <text x="160" y="152" font-size="14" font-weight="700" fill="#7fb0ff" font-family="Arial, sans-serif">Linux VPS — Agents</text>

  <rect x="985" y="130" width="320" height="170" rx="10" fill="#332a1a" stroke="#7a5a2e" stroke-width="1.5"/>
  <text x="1000" y="152" font-size="14" font-weight="700" fill="#d9a34d" font-family="Arial, sans-serif">Dev Machine — Unity, Agents</text>

  <rect x="330" y="30" width="250" height="70" rx="8" fill="#1c2028" stroke="#8b93a3" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="455" y="58" text-anchor="middle" font-size="15" font-weight="700" fill="#f1f3f6" font-family="Arial, sans-serif">Remote Session</text>
  <text x="455" y="78" text-anchor="middle" font-size="12" fill="#9aa5b1" font-family="Arial, sans-serif">spec review (optional)</text>

  <line x1="395" y1="185" x2="450" y2="100" stroke="#8b93a3" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowPd)"/>
  <line x1="460" y1="100" x2="535" y2="175" stroke="#8b93a3" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrowPd)"/>

  <rect x="20" y="175" width="110" height="70" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <text x="75" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2233" font-family="Arial, sans-serif">GitHub</text>
  <text x="75" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2233" font-family="Arial, sans-serif">Issue</text>
  <line x1="130" y1="210" x2="153" y2="210" stroke="#c3c9d3" stroke-width="2" marker-end="url(#arrowP)"/>

  <rect x="160" y="175" width="140" height="70" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <text x="230" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2233" font-family="Arial, sans-serif">Spec</text>
  <text x="230" y="223" text-anchor="middle" font-size="12" fill="#5b6472" font-family="Arial, sans-serif">(/specify)</text>
  <rect x="172" y="255" width="116" height="24" rx="12" fill="#24344d"/>
  <text x="230" y="271" text-anchor="middle" font-size="11" fill="#8fc1ff" font-family="Arial, sans-serif">ai-specify</text>
  <line x1="300" y1="210" x2="323" y2="210" stroke="#c3c9d3" stroke-width="2" marker-end="url(#arrowP)"/>

  <rect x="330" y="185" width="110" height="50" rx="6" fill="#2a2f3a" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="385" y="215" text-anchor="middle" font-size="13" fill="#c3c9d3" font-family="Arial, sans-serif">spec.md</text>
  <line x1="440" y1="210" x2="463" y2="210" stroke="#c3c9d3" stroke-width="2" marker-end="url(#arrowP)"/>

  <rect x="470" y="175" width="140" height="70" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <text x="540" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2233" font-family="Arial, sans-serif">Plan</text>
  <text x="540" y="223" text-anchor="middle" font-size="12" fill="#5b6472" font-family="Arial, sans-serif">(/plan)</text>
  <rect x="484" y="255" width="112" height="24" rx="12" fill="#24344d"/>
  <text x="540" y="271" text-anchor="middle" font-size="11" fill="#8fc1ff" font-family="Arial, sans-serif">ai-plan</text>
  <line x1="610" y1="210" x2="633" y2="210" stroke="#c3c9d3" stroke-width="2" marker-end="url(#arrowP)"/>

  <rect x="640" y="185" width="110" height="50" rx="6" fill="#2a2f3a" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="695" y="215" text-anchor="middle" font-size="13" fill="#c3c9d3" font-family="Arial, sans-serif">plan.md</text>
  <line x1="750" y1="210" x2="773" y2="210" stroke="#c3c9d3" stroke-width="2" marker-end="url(#arrowP)"/>

  <rect x="780" y="175" width="140" height="70" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <text x="850" y="204" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2233" font-family="Arial, sans-serif">Implement</text>
  <text x="850" y="223" text-anchor="middle" font-size="12" fill="#5b6472" font-family="Arial, sans-serif">(/implement)</text>
  <rect x="777" y="255" width="146" height="24" rx="12" fill="#24344d"/>
  <text x="850" y="271" text-anchor="middle" font-size="11" fill="#8fc1ff" font-family="Arial, sans-serif">ai-implement</text>
  <line x1="920" y1="210" x2="993" y2="210" stroke="#c3c9d3" stroke-width="2" marker-end="url(#arrowP)"/>

  <rect x="1000" y="175" width="290" height="70" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <text x="1145" y="200" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2233" font-family="Arial, sans-serif">PR review +</text>
  <text x="1145" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#1a2233" font-family="Arial, sans-serif">Unity smoke test</text>
  <line x1="1290" y1="210" x2="1323" y2="210" stroke="#c3c9d3" stroke-width="2" marker-end="url(#arrowP)"/>

  <rect x="1330" y="185" width="90" height="50" rx="6" fill="#2a2f3a" stroke="#6b7280" stroke-width="1.5"/>
  <text x="1375" y="215" text-anchor="middle" font-size="13" fill="#c3c9d3" font-family="Arial, sans-serif">main</text>
  <line x1="1420" y1="210" x2="1443" y2="210" stroke="#c3c9d3" stroke-width="2" marker-end="url(#arrowP)"/>

  <rect x="1450" y="175" width="150" height="70" rx="8" fill="#e8f0ff" stroke="#4c8dff" stroke-width="2"/>
  <text x="1525" y="216" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2233" font-family="Arial, sans-serif">Unity Play</text>
</svg>
