<svg width="1400" height="260" viewBox="0 0 1400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Resources flow: ResourceDefinitions config feeds ECS components (Resource, ResourceOwner, ResourceLink, ResourceEffect), which feed the ResourceCollectorRegistry of pluggable formulas (population, score, recruits, damage, durability, base income), which feeds ResourceSystem.Update (instant, daily, or monthly effects, with clamping, caps, and history), which feeds VisualState via ResourceQuery into the UI Toolkit HUD.">
  <rect width="1400" height="260" fill="#1c2028"/>
  <defs>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8dff"/>
    </marker>
  </defs>

  <rect x="25" y="80" width="250" height="100" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <text x="150" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#1a2233" font-family="Arial, sans-serif">ResourceDefinitions</text>
  <text x="150" y="142" text-anchor="middle" font-size="13" fill="#5b6472" font-family="Arial, sans-serif">(config)</text>
  <line x1="275" y1="130" x2="298" y2="130" stroke="#4c8dff" stroke-width="2.5" marker-end="url(#arrowR)"/>

  <rect x="300" y="80" width="250" height="100" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <text x="425" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2233" font-family="Arial, sans-serif">ECS components</text>
  <text x="425" y="134" text-anchor="middle" font-size="12.5" fill="#5b6472" font-family="Arial, sans-serif">Resource · ResourceOwner</text>
  <text x="425" y="152" text-anchor="middle" font-size="12.5" fill="#5b6472" font-family="Arial, sans-serif">ResourceLink · ResourceEffect</text>
  <line x1="550" y1="130" x2="573" y2="130" stroke="#4c8dff" stroke-width="2.5" marker-end="url(#arrowR)"/>

  <rect x="575" y="80" width="250" height="100" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <text x="700" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2233" font-family="Arial, sans-serif">ResourceCollectorRegistry</text>
  <text x="700" y="126" text-anchor="middle" font-size="12" fill="#5b6472" font-family="Arial, sans-serif">pluggable formulas: population,</text>
  <text x="700" y="142" text-anchor="middle" font-size="12" fill="#5b6472" font-family="Arial, sans-serif">score, recruits, damage,</text>
  <text x="700" y="158" text-anchor="middle" font-size="12" fill="#5b6472" font-family="Arial, sans-serif">durability, base income</text>
  <line x1="825" y1="130" x2="848" y2="130" stroke="#4c8dff" stroke-width="2.5" marker-end="url(#arrowR)"/>

  <rect x="850" y="80" width="250" height="100" rx="8" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5"/>
  <text x="975" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2233" font-family="Arial, sans-serif">ResourceSystem.Update</text>
  <text x="975" y="134" text-anchor="middle" font-size="12.5" fill="#5b6472" font-family="Arial, sans-serif">instant / daily / monthly</text>
  <text x="975" y="152" text-anchor="middle" font-size="12.5" fill="#5b6472" font-family="Arial, sans-serif">clamp · caps · history</text>
  <line x1="1100" y1="130" x2="1123" y2="130" stroke="#4c8dff" stroke-width="2.5" marker-end="url(#arrowR)"/>

  <rect x="1125" y="80" width="250" height="100" rx="8" fill="#e8f0ff" stroke="#4c8dff" stroke-width="2"/>
  <text x="1250" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2233" font-family="Arial, sans-serif">VisualState</text>
  <text x="1250" y="134" text-anchor="middle" font-size="12.5" fill="#43516b" font-family="Arial, sans-serif">(ResourcesState)</text>
  <text x="1250" y="152" text-anchor="middle" font-size="12.5" fill="#43516b" font-family="Arial, sans-serif">via ResourceQuery → UI Toolkit HUD</text>
</svg>
